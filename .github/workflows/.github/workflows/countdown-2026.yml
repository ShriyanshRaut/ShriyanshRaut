name: Update 2026 Countdown

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  countdown:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Calculate days left in 2026
        run: |
          END=$(date -d "2026-12-31" +%s)
          NOW=$(date +%s)
          DAYS=$(( (END - NOW) / 86400 ))
          echo "DAYS_LEFT=$DAYS" >> $GITHUB_ENV

      - name: Update README
        run: |
          sed -i "s/Days%20Left%20in%202026-[^)]*/Days%20Left%20in%202026-${DAYS_LEFT}/g" README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          git commit -m "Update 2026 countdown" || echo "No changes"
          git push
